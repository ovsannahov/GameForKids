function openTrade(cid){
  const kids=kidsOf(cid);const T={a:kids[0]&&kids[0].id,b:kids[1]&&kids[1].id,ca:null,cb:null};
  openModal({cls:'wide',live:true,html:()=>{
    const ks=kidsOf(cid);
    if(!S.students[T.a]||S.students[T.a].archived)T.a=ks[0]&&ks[0].id;
    if(!S.students[T.b]||S.students[T.b].archived||T.b===T.a)T.b=(ks.find(k=>k.id!==T.a)||{}).id;
    const A1=S.students[T.a],B1=S.students[T.b];
    if(A1&&!((A1.cards||{})[T.ca]>0))T.ca=null;if(B1&&!((B1.cards||{})[T.cb]>0))T.cb=null;
    const col=(side,st,other,sel)=>'<div class="tcol"><h3>'+(side==='a'?'Учень 1':'Учень 2')+'</h3><div class="who">'+ks.map(k=>'<button data-who="'+side+'" data-v="'+k.id+'" class="'+(st&&k.id===st.id?'sel':'')+'" '+(other&&k.id===other.id?'disabled':'')+'><img src="'+A[k.avatar]+'" alt=""><span>'+esc(k.name)+'</span></button>').join('')+'</div>'+
      (st?'<div class="tcards">'+(CARDS.filter(c=>(st.cards||{})[c.id]>0).map(c=>{const n=st.cards[c.id];return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">'+cardHTML(c,{w:92,count:n,cls:sel===c.id?'sel':'',attrs:'data-tc="'+side+'" data-c="'+c.id+'"'})+(n===1?'<span class="last">остання</span>':'')+'</div>';}).join('')||'<p class="note">Карточок ще немає</p>')+'</div>':'')+'</div>';
    const ca=T.ca&&CARD[T.ca],cb=T.cb&&CARD[T.cb];
    return '<h2>🔄 Trading Market</h2><div class="trade">'+col('a',A1,B1,T.ca)+
     '<div class="tmid"><div class="phr"><small>Say it in English</small>'+(A1?esc(A1.name):'')+': “Do you have '+(cb?artOf(cb)+esc(cb.n):'a …')+'?”<br>'+(B1?esc(B1.name):'')+': “Yes, I do! Do you have '+(ca?artOf(ca)+esc(ca.n):'a …')+'?”<br>“Let\'s swap!”</div>'+
     '<button class="btn gold big" id="swap" '+(ca&&cb&&T.ca!==T.cb?'':'disabled')+'>🔄 Swap!</button><p class="note">Оберіть по одній карточці в кожного</p></div>'+
     col('b',B1,A1,T.cb)+'</div>';
  },mount:el=>{
    el.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{T[b.dataset.who]=b.dataset.v;T['c'+b.dataset.who]=null;drawModal();});
    el.querySelectorAll('[data-tc]').forEach(c=>c.onclick=()=>{T['c'+c.dataset.tc]=c.dataset.c;sfx.pop();drawModal();});
    el.querySelector('#swap').onclick=()=>{const a=T.a,ca=T.ca,b=T.b,cb=T.cb;T.ca=T.cb=null;trade(a,ca,b,cb);};
  }});
}
function openHistory(cid){
  openModal({side:true,live:true,html:()=>{
    const h=S.history[cid];const items=(h&&h.items)||[];
    return '<h2>↶ Історія дій</h2><p class="note" style="margin-bottom:14px">Будь-яку дію можна скасувати і повернути. Ctrl+Z скасовує останню.</p>'+
     (items.length?items.map(it=>{const d=new Date(it.t);return '<div class="hist-item'+(it.undone?' undone':'')+'"><span class="t">'+pad(d.getHours())+':'+pad(d.getMinutes())+'</span><span class="l">'+esc(it.label)+'</span><button class="btn" data-a="'+(it.undone?'redo':'undo')+'" data-id="'+it.id+'">'+(it.undone?'↷ Повернути':'↶ Скасувати')+'</button></div>';}).join(''):'<p class="note">Ще нічого не сталося.</p>');
  }});
}
function openSettings(){
  const s=S.settings;
  openModal({cls:'mid',html:()=>'<h2>⚙️ Налаштування сезону</h2>'+
   '<div class="grid2"><label class="field"><span>Назва сезону</span><input class="inp" id="ss" value="'+esc(s.season)+'"></label>'+
   '<label class="field"><span>Ціна паку (⭐)</span><input class="inp" id="sp" type="number" min="1" value="'+s.packPrice+'"></label>'+
   '<label class="field"><span>Максимум ⭐ за урок на дитину</span><input class="inp" id="sl" type="number" min="1" value="'+s.lessonCap+'"></label>'+
   '<label class="field"><span>Ціль класу: ⭐ на одну дитину</span><input class="inp" id="sg" type="number" min="1" value="'+s.goalPerKid+'"></label>'+
   '<label class="field"><span>🤫 Shh: секунд на тишу</span><input class="inp" id="sh" type="number" min="3" value="'+(s.shhSecs||10)+'"></label></div>'+
   '<div class="row end"><button class="btn gold" id="ssave">Зберегти</button></div>'+
   '<h3 style="margin:22px 0 8px">Як працює економіка</h3><p class="note">Пак = 3 карточки. Шанс кожної карточки: звичайна 62%, рідкісна 26%, епічна 9%, легендарна 3%. Епічна дає випадковий тікет, легендарна дає тікет на вибір. Приблизно кожен третій пак приносить тікет. 24 карточки в сезоні: 12 звичайних, 7 рідкісних, 3 епічні, 2 легендарні. Три зайві копії можна перетворити на нову карточку.</p>'+
   '<h3 style="margin:22px 0 8px">Новий сезон</h3><p class="note" style="margin-bottom:10px">Обнуляє зірочки всіх учнів. Карточки, тікети і класи залишаються. Цю дію не можна скасувати.</p><button class="btn danger" id="snew">❄️ Почати новий сезон</button>',
   mount:el=>{
     el.querySelector('#ssave').onclick=()=>{
       const num=(id,min)=>Math.max(min,parseInt(el.querySelector(id).value,10)||min);
       S.settings=Object.assign({},s,{season:el.querySelector('#ss').value.trim()||'Winter Magic',packPrice:num('#sp',1),lessonCap:num('#sl',1),goalPerKid:num('#sg',1),shhSecs:num('#sh',3)});
       saveSettings();closeModal();schedule();toast('Налаштування збережено');
     };
     el.querySelector('#snew').onclick=()=>confirmBox('Почати новий сезон? Зірочки всіх учнів стануть 0.','Так, новий сезон',()=>{
       Object.values(S.students).forEach(st=>saveStudent(Object.assign({},st,{stars:0,earned:0,lesson:0})));
       S.settings=Object.assign({},S.settings,{seasonNo:(S.settings.seasonNo||1)+1});saveSettings();schedule();toast('Новий сезон почався! ❄️');
     },true);
   }});
}
function zoomCard(cid){
  const c=CARD[cid];
  const el=stage('<button class="ibtn stage-x">✕</button><div class="slot" style="--i:0">'+cardHTML(c,{w:Math.min(330,innerHeight*.5)})+'</div><div class="use-sub">'+esc(c.n)+' · '+RAR[c.r].n+'</div>');
  el.onclick=()=>closeStage(el);sfx.flip();
}

/* ---------- stages ---------- */
function stage(html){const el=document.createElement('div');el.className='stage';el.innerHTML='<div class="stage-bg"></div>'+html;document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('in'));return el;}
function closeStage(el){el.classList.remove('in');el.classList.add('out');setTimeout(()=>el.remove(),320);}
function flash(el,col){const f=document.createElement('div');f.className='flash';if(col)f.style.background=col;el.appendChild(f);setTimeout(()=>f.remove(),520);}
function showPack(st,res,item){
  const el=stage('<div class="stage-title"><img src="'+A[st.avatar]+'" alt=""><span>'+esc(st.name)+' opens a pack!</span></div>'+
   '<div class="pack-zone"><div class="pack" id="pk"><div class="pack-top"><div class="crimp"></div></div><div class="pack-body"><div class="pack-season">SEASON '+S.settings.seasonNo+'</div><img class="pack-emblem" src="'+A.c_snowflake+'" alt=""><div class="pack-name">WINTER<br>MAGIC</div><div class="pack-sub">★ 3 CARDS ★</div><div class="crimp bottom"></div></div><div class="pack-foil"></div></div></div>'+
   '<div class="stage-hint">Tap to open! 👆</div>');
  sfx.whoosh();
  const pk=el.querySelector('#pk');let opened=false;
  pk.addEventListener('click',async()=>{
    if(opened)return;opened=true;el.querySelector('.stage-hint').style.visibility='hidden';
    pk.classList.add('shake');sfx.rumble();await sleep(650);
    pk.classList.remove('shake');pk.style.animation='none';void pk.offsetWidth;pk.style.animation='';
    pk.classList.add('torn');sfx.tear();const r=pk.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+30,'#bfe6ff',30);
    await sleep(380);flash(el);pk.classList.add('drop');await sleep(380);
    el.querySelector('.pack-zone').remove();el.querySelector('.stage-hint').remove();
    reveal(el,st,res,item);
  });
}
function reveal(el,st,res,item){
  const W=Math.max(150,Math.min(250,Math.floor((innerWidth-80)/res.length)-40,Math.floor((innerHeight-330)*5/7)));
  const row=document.createElement('div');row.className='reveal-row';
  row.innerHTML=res.map((r,i)=>'<div class="slot" style="--i:'+i+'"><div class="flip" data-i="'+i+'"><div class="side back glow-'+r.card.r+'">'+backHTML(W)+'</div><div class="side front">'+cardHTML(r.card,{w:W})+'</div></div><div class="slot-badges"></div></div>').join('');
  el.appendChild(row);
  const ctr=document.createElement('div');ctr.className='stage-ctrl';
  ctr.innerHTML=res.length>1?'<button class="btn" data-x="all">✨ Open all</button>':'<div class="stage-hint">Tap the card! 👆</div>';
  el.appendChild(ctr);
  let flipped=0,choosing=0,done=false;const flippedSet=new Set();
  const check=()=>{if(flipped===res.length&&!choosing&&!done){done=true;ctr.innerHTML='<button class="btn gold big" data-x="collect">Collect! ✨</button>';}};
  const flipOne=async i=>{
    if(flippedSet.has(i))return;flippedSet.add(i);
    const f=row.querySelector('.flip[data-i="'+i+'"]');f.classList.add('on');flipped++;sfx.flip();
    const r=res[i];await sleep(400);
    const slot=f.parentElement;const b=slot.querySelector('.slot-badges');
    rarityFx(el,f,r.card.r);
    b.innerHTML=(r.card.r!=='c'?'<div class="badge rar r-'+r.card.r+'" style="background:'+RAR[r.card.r].col+'">'+RAR[r.card.r].n.toUpperCase()+'!</div>':'')+(r.isNew?'<div class="badge new">✨ NEW!</div>':'<div class="badge dup">Duplicate ×'+r.count+'</div>');
    if(r.ticket){await sleep(500);const t=document.createElement('div');t.className='tk-chip';t.innerHTML='<img src="'+A[TICKETS[r.ticket].img]+'" alt=""><span>🎟 Ticket: '+TICKETS[r.ticket].n+'!<small>'+esc(TICKETS[r.ticket].ua)+'</small></span>';b.appendChild(t);sfx.ticket();}
    if(r.choose){choosing++;await sleep(1300);chooseTicket(el,st,item,()=>{choosing--;check();});}
    check();
  };
  row.addEventListener('click',e=>{const f=e.target.closest('.flip');if(f)flipOne(+f.dataset.i);});
  ctr.addEventListener('click',async e=>{
    const x=e.target.closest('[data-x]');if(!x)return;
    if(x.dataset.x==='all'){x.remove();for(let i=0;i<res.length;i++){if(!flippedSet.has(i)){flipOne(i);await sleep(650);}}}
    if(x.dataset.x==='collect'){sfx.pop();closeStage(el);}
  });
}
function rarityFx(el,target,r){
  const rc=target.getBoundingClientRect();const cx=rc.left+rc.width/2,cy=rc.top+rc.height/2;
  const ring=col=>{const g=document.createElement('div');g.className='ring';g.style.left=cx+'px';g.style.top=cy+'px';g.style.position='fixed';g.style.borderColor=col;el.appendChild(g);setTimeout(()=>g.remove(),850);};
  if(r==='c'){sparkle(cx,cy,'#ffffff',10);return;}
  if(r==='r'){ring('#3fa3ff');sparkle(cx,cy,'#7cc4ff',24);sfx.rare();return;}
  if(r==='e'){ring('#b26bff');setTimeout(()=>ring('#e2b8ff'),150);sparkle(cx,cy,'#c58bff',40);sparkle(cx,cy,'#ffffff',20);sfx.epic();
    const ry=document.createElement('div');ry.className='rays purple';ry.style.position='fixed';ry.style.left=cx+'px';ry.style.top=cy+'px';el.insertBefore(ry,el.children[1]);return;}
  if(r==='l'){flash(el,'#fff3c4');el.classList.add('quake');setTimeout(()=>el.classList.remove('quake'),520);
    const ry=document.createElement('div');ry.className='rays';ry.style.position='fixed';ry.style.left=cx+'px';ry.style.top=cy+'px';el.insertBefore(ry,el.children[1]);
    ring('#ffc53d');setTimeout(()=>ring('#fff1a1'),180);sparkle(cx,cy,'#ffd45c',60);confetti(160,['#ffd45c','#ffb300','#fff3a8','#ffffff','#ffe27a']);sfx.legend();}
}
function chooseTicket(el,st,item,cb){
  const box=document.createElement('div');box.className='chooser';
  box.innerHTML='<h3>⭐ LEGENDARY BONUS! Choose a ticket:</h3><div class="tks">'+TK.map(t=>'<button data-t="'+t+'">'+ticketHTML(t,false,true)+'</button>').join('')+'</div>';
  box.style.position='absolute';box.style.left='50%';box.style.top='50%';box.style.transform='translate(-50%,-50%)';
  el.appendChild(box);sfx.ticket();
  box.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
    addTicketToItem(st.classId,item.id,st.id,t);box.remove();confetti(60);sfx.ticket();toast('🎟 '+st.name+' отримує тікет '+TICKETS[t].n+'!');cb();};
}
function showForge(st,picks,res,item){
  const el=stage('<div class="stage-title"><img src="'+A[st.avatar]+'" alt=""><span>Snow Forge 🔮</span></div><div class="forge-zone">'+picks.map(id=>'<div class="fg">'+cardHTML(CARD[id],{w:130})+'</div>').join('')+'<div class="forge-orb"><img src="'+A.u_crystal+'" alt=""></div></div>');
  const z=el.querySelector('.forge-zone');
  setTimeout(()=>{z.classList.add('merge');sfx.whoosh();},500);
  setTimeout(()=>{sfx.rumble();},1300);
  setTimeout(()=>{flash(el,'#e9d6ff');z.remove();reveal(el,st,[res],item);},2100);
}
function showSwap(a,ca,b,cb){
  const el=stage('<div class="stage-title">🔄 Swap!</div><div class="swap-zone"><div class="sw"><img class="av" src="'+A[a.avatar]+'" alt="">'+esc(a.name)+'<div class="slot" style="--i:0">'+cardHTML(CARD[cb],{w:170})+'</div></div><div class="swap-arrow">⇄</div><div class="sw"><img class="av" src="'+A[b.avatar]+'" alt="">'+esc(b.name)+'<div class="slot" style="--i:1">'+cardHTML(CARD[ca],{w:170})+'</div></div></div><div class="use-sub">Thank you! 🤝</div>');
  sfx.whoosh();setTimeout(sfx.rare,300);confetti(50);
  el.onclick=()=>closeStage(el);setTimeout(()=>{if(el.isConnected)closeStage(el);},2600);
}
function showTicketUse(st,tid,fr){
  const t=TICKETS[tid];
  const sub=tid==='double'?'⚡ '+esc(st.name)+': next star = ⭐⭐':tid==='gift'&&fr?esc(st.name)+' → ⭐ → '+esc(fr.name):esc(st.name)+' · '+esc(t.ua);
  const el=stage('<div class="rays" style="position:absolute"></div><div class="use-ticket">'+ticketHTML(tid,true)+'</div><div class="use-text">'+esc(t.en)+'</div><div class="use-sub">'+sub+'</div><div class="stage-ctrl"><button class="btn gold big" data-x="ok">Yay! 🎉</button></div>');
  sfx.ticket();setTimeout(sfx.party,500);setTimeout(()=>confetti(120),400);
  el.querySelector('[data-x]').onclick=()=>closeStage(el);
}
function showGoal(c){
  const el=stage('<div class="rays" style="position:absolute"></div><div class="use-text">🎉 CLASS GOAL!</div><div class="use-sub">'+esc(c.name)+' · '+esc(c.reward||'Class party 🎉')+'</div><div class="stage-ctrl"><button class="btn gold big" data-x="ok">Hooray! 🙌</button></div>');
  sfx.party();confetti(200);setTimeout(()=>confetti(120),900);
  el.querySelector('[data-x]').onclick=()=>closeStage(el);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(pop.classList.contains('on')&&!e.target.closest('#pop'))closePop();return;}
  const a=t.dataset.a,id=t.dataset.id;
  if(a!=='kid'&&a!=='award'&&!t.closest('#pop'))closePop();
  switch(a){
    case 'home':UI.view='home';closePop();render();window.scrollTo(0,0);break;
    case 'openClass':UI.view='class';UI.classId=id;render();window.scrollTo(0,0);break;
    case 'addClass':editClass(null);break;
    case 'editClass':editClass(id);break;
    case 'restoreClass':{const c=S.classes[id];if(c){saveClass(Object.assign({},c,{archived:false}));schedule();toast('Клас відновлено');}break;}
    case 'kid':if(UI.busy)break;if(popSid===id)closePop();else openPop(id,t);break;
    case 'award':{const r=t.getBoundingClientRect();closePop();award(id,t.dataset.r,r);break;}
    case 'team':teamStar(UI.classId,t.getBoundingClientRect());break;
    case 'profile':openProfile(id);break;
    case 'pack':openPack(id);break;
    case 'forge':openForge(id);break;
    case 'zoom':zoomCard(t.dataset.c);break;
    case 'useTicket':{const tid=t.dataset.t;if(tid==='gift'){if(kidsOf(S.students[id].classId).length<2){toast('У класі немає кому подарувати');break;}openGift(id);}else useTicket(id,tid);break;}
    case 'corr':correct(id,parseInt(t.dataset.n,10));break;
    case 'kids':openKids(UI.classId);break;
    case 'addKid':editKid(null,UI.classId);break;
    case 'editKid':editKid(id,null);break;
    case 'archKid':{const st=S.students[id];confirmBox('Перемістити '+st.name+' в архів? Прогрес збережеться, учня можна повернути.','В архів',()=>{archiveKid(id);openKids(st.classId);},true);break;}
    case 'restoreKid':restoreKid(id);break;
    case 'trade':openTrade(UI.classId);break;
    case 'history':openHistory(UI.classId);break;
    case 'undo':undoItem(UI.classId,id,false);break;
    case 'redo':undoItem(UI.classId,id,true);break;
    case 'newLesson':confirmBox('Почати новий урок? Ліміт «'+S.settings.lessonCap+' ⭐ за урок» обнулиться для всіх у класі. Зірочки залишаються.','Новий урок 🔔',()=>{const c=S.classes[UI.classId];saveClass(Object.assign({},c,{lessonKey:today()+'-'+Date.now()}));schedule();toast('🔔 Новий урок почався!');});break;
    case 'settings':openSettings();break;
    case 'help':openHelp();break;
    case 'tkinfo':e.preventDefault();openTicketsInfo();break;
    case 'shh':startShh();break;
    case 'pick':pickRandom();break;
    case 'sixseven':sixSeven();break;
    case 'delClass':askDeleteClass(id);break;
    case 'delKid':askDeleteKid(id);break;
    case 'closeModal':closeModal();break;
    case 'mute':UI.muted=!UI.muted;try{localStorage.setItem('wm_muted',UI.muted?'1':'0');}catch(err){}render();if(!UI.muted)sfx.pop();break;
    case 'fs':{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Повноекранний режим тут недоступний'));}catch(err){toast('Повноекранний режим тут недоступний');}break;}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(pop.classList.contains('on'))closePop();else if(M.cur)closeModal();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undoLatest();}
});
let tiltEl=null;
document.addEventListener('pointermove',e=>{
  const el=e.target.closest?e.target.closest('[data-tilt]'):null;
  if(tiltEl&&tiltEl!==el){const i=tiltEl.querySelector('.card-inner');if(i){i.style.removeProperty('--rx');i.style.removeProperty('--ry');}tiltEl=null;}
  if(!el)return;tiltEl=el;const r=el.getBoundingClientRect();const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  const i=el.querySelector('.card-inner');if(!i)return;
  i.style.setProperty('--ry',((px-.5)*26)+'deg');i.style.setProperty('--rx',((.5-py)*26)+'deg');i.style.setProperty('--mx',(px*100)+'%');i.style.setProperty('--my',(py*100)+'%');
},{passive:true});
window.addEventListener('resize',closePop);

/* ---------- snow ---------- */
(function(){
  const cv=$('#snow'),cx=cv.getContext('2d');let W,H,fl=[];
  const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;const n=Math.min(140,Math.floor(W*H/14000));fl=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*2.6,s:.3+Math.random()*1.1,d:Math.random()*Math.PI*2}));};
  rs();addEventListener('resize',rs);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const tick=()=>{if(!document.hidden){cx.clearRect(0,0,W,H);
    for(const f of fl){f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.4;if(f.y>H+5){f.y=-5;f.x=Math.random()*W;}
      cx.beginPath();cx.arc(f.x,f.y,f.r,0,Math.PI*2);cx.fillStyle='rgba(255,255,255,'+(.6+f.r/7)+')';cx.shadowColor='rgba(90,140,220,.45)';cx.shadowBlur=4;cx.fill();}}
    requestAnimationFrame(tick);};
  tick();
})();

init();
})();
</script>
