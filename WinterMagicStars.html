<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winter Magic Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a5c;--muted:#5d6b9c;--dim:#8c97bf;
  --panel:rgba(255,255,255,.88);--panel2:#f2f6ff;--line:#dfe7fb;
  --shadow:0 10px 28px rgba(60,90,180,.14);
  --gold:#ffb81f;--mint:#2fd6a3;--pink:#ff6fa5;--blue:#4f9dff;--violet:#9b5cff;
  --c-common:#8c99b0;--c-rare:#1f7cff;--c-epic:#8a3cf0;--c-leg:#f2a600;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#dff0ff;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(700px 420px at 88% -6%,rgba(255,236,170,.9),transparent 60%),
  radial-gradient(900px 500px at 8% -10%,rgba(190,235,255,1),transparent 60%),
  radial-gradient(800px 600px at 60% 30%,rgba(236,222,255,.85),transparent 65%),
  linear-gradient(180deg,#c9e8ff 0%,#e4f1ff 45%,#f6efff 100%)}
body::after{content:"";position:fixed;left:-10%;right:-10%;bottom:-2px;height:20vh;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 120% at 20% 100%,#ffffff 0 55%,transparent 56%),radial-gradient(55% 110% at 80% 100%,#f4f8ff 0 55%,transparent 56%),radial-gradient(40% 90% at 50% 100%,#eef5ff 0 55%,transparent 56%)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:Rubik,Nunito,system-ui,sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45;filter:grayscale(.5)}
input,select{font:inherit;color:var(--ink)}
img{user-select:none;-webkit-user-drag:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;padding:11px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);color:var(--ink);box-shadow:0 4px 0 #d3dcf5;transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 0 #d3dcf5}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #d3dcf5}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#ffb81f);color:#4a2c00;border:0;box-shadow:0 5px 0 #d08a00}
.btn.gold:not(:disabled):hover{box-shadow:0 7px 0 #d08a00}
.btn.mint{background:linear-gradient(180deg,#7ff0c9,#20c592);color:#053b2a;border:0;box-shadow:0 5px 0 #119068}
.btn.pink{background:linear-gradient(180deg,#ffa3c6,#ff5c98);color:#fff;border:0;box-shadow:0 5px 0 #d23a73}
.btn.ice{background:linear-gradient(180deg,#8fd0ff,#3d8bff);color:#fff;border:0;box-shadow:0 5px 0 #2563d1}
.btn.purple{background:linear-gradient(180deg,#d7b0ff,#8f4dff);color:#fff;border:0;box-shadow:0 5px 0 #6526c4}
.btn.danger{background:#fff0f3;border-color:#ffc4d1;color:#d0264f;box-shadow:0 4px 0 #ffd3dd}
.btn.big{font-size:18px;padding:14px 22px;border-radius:20px}
.btn.wide{width:100%}
.ibtn{width:46px;height:46px;border-radius:15px;display:inline-grid;place-items:center;font-size:20px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 #d3dcf5;transition:transform .12s}
.ibtn:hover{transform:translateY(-2px)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:54px;height:54px;filter:drop-shadow(0 6px 10px rgba(255,170,0,.4));animation:bob 3s ease-in-out infinite}
.brand-t{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:25px;line-height:1.05;color:#1d2a5c}
.brand-s{color:var(--muted);font-weight:800;font-size:14px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top-actions .sep{width:2px;height:30px;background:var(--line);margin:0 4px;border-radius:2px}
.cls-title{display:flex;align-items:center;gap:12px;margin-right:auto}
.cls-emoji{font-size:42px;filter:drop-shadow(0 4px 8px rgba(60,90,180,.25))}
.banner{margin:0 22px 10px;padding:10px 14px;border-radius:14px;background:#fff6dc;border:2px solid #ffe08a;color:#7a5200;font-weight:800;font-size:14px}

/* home */
.home{padding:6px 22px 60px;max-width:1300px;width:100%;margin:0 auto}
.h{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:22px;margin:10px 0 14px}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.class-tile{position:relative;text-align:left;padding:20px;border-radius:26px;background:#fff;border:3px solid #fff;overflow:hidden;min-height:200px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.class-tile::before{content:"";position:absolute;inset:0 0 auto 0;height:86px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff));opacity:.55}
.class-tile>*{position:relative}
.class-tile:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 18px 40px rgba(60,90,180,.22);border-color:var(--c)}
.class-tile .ct-emoji{font-size:46px}
.class-tile .ct-name{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:24px}
.class-tile .ct-sub{color:var(--muted);font-weight:800;font-size:14px}
.ava-stack{display:flex;margin-top:auto}
.ava-stack img{width:40px;height:40px;border-radius:50%;background:#eef4ff;border:3px solid #fff;margin-left:-9px;padding:2px;box-shadow:0 2px 6px rgba(60,90,180,.2)}
.ava-stack img:first-child{margin-left:0}
.class-tile.add{align-items:center;justify-content:center;border:3px dashed #b9cbf2;background:rgba(255,255,255,.55);font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:20px;color:var(--muted);box-shadow:none}
.class-tile.add::before{display:none}
.class-tile.add span{font-size:46px;line-height:1}
.mini-bar{height:10px;border-radius:99px;background:#e8eefc;overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2fd6a3,#4f9dff,#9b5cff)}
.welcome{padding:28px;border-radius:28px;background:#fff;box-shadow:var(--shadow);display:flex;gap:24px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.welcome img{width:110px}
.welcome h2{font-size:26px;margin-bottom:6px}
.welcome p{color:var(--muted);font-weight:700;max-width:620px;line-height:1.45}
details.arch{margin-top:26px;color:var(--muted)}
details.arch summary{cursor:pointer;font-weight:900}
.arch-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(60,90,180,.08)}
.arch-row b{margin-right:auto;color:var(--ink)}

/* class view */
.goal{margin:0 22px 8px;padding:12px 16px;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.goal-label{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;margin-bottom:8px;flex-wrap:wrap}
.goal-label img{width:28px}
.goal-label .rw{margin-left:auto;color:#c77d00}
.goal-label .q{color:var(--dim);font-weight:800;font-size:13px}
.goal-bar{position:relative;height:20px;border-radius:99px;background:#e8eefc;overflow:hidden;box-shadow:inset 0 2px 4px rgba(60,90,180,.15)}
.goal-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#2fd6a3,#4f9dff,#9b5cff,#ff6fa5,#2fd6a3);background-size:200% 100%;animation:aurora 6s linear infinite;transition:width .8s cubic-bezier(.3,1.3,.5,1)}
.goal-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 10px,transparent 10px 22px);animation:stripes 1.2s linear infinite}
.goal.done .goal-fill{background:linear-gradient(90deg,#ffe27a,#ffb81f,#ffe27a);background-size:200% 100%}
.kids-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(175px,15.5vw,250px),1fr));gap:18px;padding:12px 22px 18px;align-content:start}
.kid{position:relative;padding:14px 12px 12px;border-radius:28px;background:#fff;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .18s,box-shadow .2s,border-color .2s;box-shadow:var(--shadow);overflow:visible}
.kid::before{content:"";position:absolute;inset:0 0 auto 0;height:44%;border-radius:25px 25px 50% 50%/25px 25px 30px 30px;background:var(--kc);opacity:.75}
.kid>*{position:relative}
.kid:hover{transform:translateY(-5px);box-shadow:0 18px 36px rgba(60,90,180,.22);border-color:var(--kc2)}
.kid.pop{animation:kidpop .6s cubic-bezier(.3,1.6,.5,1)}
.kid.pop .kid-stars b{animation:numpop .6s}
.kid.pop .kid-ava img{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
.kid.shake{animation:shakeX .45s}
.kid.spot{border-color:#ffb81f;box-shadow:0 0 0 6px rgba(255,184,31,.45),0 18px 40px rgba(255,170,0,.35);transform:translateY(-6px) scale(1.04)}
.kid.complete{border-color:#ffc53d}
.kid-ava{width:clamp(88px,8vw,122px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fff,rgba(255,255,255,.4) 70%);box-shadow:0 6px 14px rgba(60,90,180,.18),inset 0 0 0 4px #fff}
.kid-ava img{width:88%;filter:drop-shadow(0 6px 8px rgba(30,40,90,.25));animation:idle 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.kid-name{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(18px,1.45vw,23px);text-align:center;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid-stars{display:flex;align-items:center;gap:6px;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(26px,2.1vw,34px);color:#e59a00;line-height:1}
.kid-stars img{width:clamp(30px,2.3vw,40px)}
.kid-stars b{display:inline-block}
.kid-cap{font-size:11px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:-2px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center}
.dots .dl{font-size:11px;font-weight:900;color:var(--dim);margin-right:3px;text-transform:uppercase;letter-spacing:.04em}
.dots i{width:9px;height:9px;border-radius:50%;background:#e3e9f8}
.dots i.on{background:var(--gold);box-shadow:0 0 0 2px #fff3cc}
.dots.full i.on{background:var(--mint);box-shadow:0 0 0 2px #d5fbee}
.kid-meta{display:flex;gap:10px;font-weight:900;font-size:13px;color:var(--muted)}
.x2{position:absolute;top:10px;left:10px;z-index:2;padding:3px 9px;border-radius:99px;background:linear-gradient(180deg,#fff19a,#ffb62e);color:#4a2c00;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:14px;animation:pulse 1.2s ease-in-out infinite;box-shadow:0 3px 8px rgba(255,170,0,.4)}
.pack-ready{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:center;gap:3px;padding:3px 9px 3px 4px;border-radius:99px;background:#fff;border:2px solid var(--mint);font-size:12px;font-weight:900;color:#0c8a62;animation:bob 2s ease-in-out infinite;box-shadow:0 3px 8px rgba(47,214,163,.35)}
.pack-ready img{width:20px}
.crown{position:absolute!important;top:-18px;left:50%;transform:translateX(-50%) rotate(-8deg);width:44px;z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px;text-align:center;color:var(--muted);font-weight:800}
.empty img{width:130px;animation:bob 3s ease-in-out infinite}
.empty h2{color:var(--ink);font-size:26px}
.rules-strip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 22px 18px}
.rules-strip .lbl{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;color:var(--muted);align-self:center;margin-right:4px;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.rchip{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:99px;background:#fff;box-shadow:0 4px 12px rgba(60,90,180,.12);font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:800;font-size:clamp(14px,1.1vw,17px)}
.rchip span{font-size:1.25em}
.bubble{position:fixed;z-index:85;padding:8px 14px;border-radius:16px;background:#fff;color:#1d2a5c;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:20px;box-shadow:0 8px 20px rgba(60,90,180,.25);white-space:nowrap;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}

/* noisy / sleepy */
body.noisy::before{animation:redpulse .6s ease-in-out infinite alternate}
.noisy .kid{animation:jitter .18s linear infinite}
.noisy .kid:nth-child(2n){animation-duration:.22s}
.noisy .kid:nth-child(3n){animation-duration:.15s}
.noisy .kid-ava img{animation:crazy .5s ease-in-out infinite alternate}
.noisy .kid:nth-child(2n) .kid-ava img{animation-duration:.38s}
.noisy .kid:nth-child(3n) .kid-ava img{animation-duration:.6s}
.sleepy .kid-ava img{animation:none;transform:rotate(-80deg) translate(-6px,6px) scale(.92);transition:transform .8s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 6px 8px rgba(30,40,90,.25)) saturate(.8)}
.sleepy .kid-ava::after{content:"💤";position:absolute;top:-6px;left:-10px;font-size:30px;animation:zzz 1.6s ease-in-out infinite}
.sleepy .kid-ava{position:relative}
.shh-bar{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:75;display:flex;align-items:center;gap:16px;padding:14px 18px 14px 24px;border-radius:26px;background:#fff;box-shadow:0 20px 50px rgba(200,40,80,.35);border:4px solid #ff6fa5;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.shh-bar.ok{border-color:var(--mint);box-shadow:0 20px 50px rgba(30,160,120,.35)}
.shh-bar.fail{border-color:#c2cbe6}
.shh-t{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(22px,2.4vw,34px)}
.shh-t small{display:block;font-family:Nunito,system-ui,sans-serif;font-size:14px;color:var(--muted);font-weight:800}
.shh-n{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:40px;color:#fff;background:conic-gradient(#ff5c98 var(--p,100%),#ffd3e2 0);box-shadow:inset 0 0 0 7px #fff}

/* popover */
#pop{position:fixed;z-index:40;display:none;width:340px;padding:14px;border-radius:24px;background:#fff;border:3px solid #fff;box-shadow:0 24px 60px rgba(40,60,140,.3)}
#pop.on{display:block;animation:popin .22s cubic-bezier(.3,1.5,.5,1)}
.pop-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pop-h img{width:46px}
.pop-h b{font-family:Rubik,Nunito,system-ui,sans-serif;font-size:19px}
.pop-h small{display:block;color:var(--muted);font-weight:800}
.pop-rules{display:grid;gap:7px}
.rule{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel2);border:2px solid transparent;transition:transform .1s,background .15s}
.rule:not(:disabled):hover{background:#fff6dc;border-color:#ffd56b;transform:translateX(3px)}
.rule .re{font-size:28px;width:34px;text-align:center}
.rule b{display:block;font-family:Rubik,Nunito,system-ui,sans-serif;font-size:17px}
.rule small{color:var(--muted);font-weight:700;font-size:13px}
.pop-foot{display:flex;gap:8px;margin-top:12px}
.pop-foot .btn{flex:1;font-size:14px;padding:10px}

/* modal */
#overlay .wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#overlay .back{position:absolute;inset:0;background:rgba(40,60,130,.35);backdrop-filter:blur(6px);animation:fade .2s}
#overlay .modal{position:relative;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:24px;border-radius:30px;background:#fff;box-shadow:0 30px 80px rgba(40,60,140,.35);animation:modalin .28s cubic-bezier(.3,1.4,.5,1)}
#overlay .modal.wide{width:min(1180px,100%)}
#overlay .modal.mid{width:min(860px,100%)}
#overlay .wrap.side{justify-content:flex-end;padding:0}
#overlay .wrap.side .modal{height:100vh;max-height:100vh;border-radius:30px 0 0 30px;width:min(460px,100%);animation:slidein .28s cubic-bezier(.3,1.2,.5,1)}
.mx{position:absolute;top:14px;right:14px;z-index:3}
.modal h2{font-size:24px;margin-bottom:14px;padding-right:50px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:900;color:var(--muted);margin-bottom:6px;font-size:14px}
.inp{width:100%;padding:12px 14px;border-radius:16px;background:var(--panel2);border:2px solid var(--line);outline:none;font-weight:800;font-size:17px}
.inp:focus{border-color:var(--blue);background:#fff}
.ava-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ava-pick button{aspect-ratio:1;border-radius:20px;background:var(--panel2);border:3px solid transparent;display:grid;place-items:center;transition:transform .12s}
.ava-pick button:hover{transform:scale(1.06)}
.ava-pick button.sel{border-color:var(--gold);background:#fff6dc}
.ava-pick img{width:80%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-width:48px;height:48px;border-radius:16px;background:var(--panel2);border:3px solid transparent;font-size:24px;padding:0 6px}
.chips button.sel{border-color:var(--gold);background:#fff6dc}
.chips .col{width:48px;border-radius:50%;border-color:#fff;box-shadow:0 0 0 2px var(--line)}
.chips .col.sel{box-shadow:0 0 0 3px var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{color:var(--muted);font-weight:700;font-size:14px;line-height:1.45}
.kid-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--panel2);margin-bottom:8px}
.kid-row img{width:46px}
.kid-row b{font-family:Rubik,Nunito,system-ui,sans-serif;font-size:18px;margin-right:auto}
.kid-row .ibtn{width:40px;height:40px;font-size:17px}
.help-list{display:grid;gap:10px}
.help-item{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--panel2)}
.help-item .hi{font-size:30px;width:40px;text-align:center;flex:none}
.help-item img.hi{width:40px}
.help-item b{display:block;font-family:Rubik,Nunito,system-ui,sans-serif;font-size:17px;margin-bottom:2px}
.help-item span{color:var(--muted);font-weight:700;font-size:14px;line-height:1.45}
.danger-zone{margin-top:22px;padding:14px;border-radius:18px;background:#fff5f7;border:2px solid #ffd3dd}
.danger-zone h3{font-size:15px;color:#d0264f;margin-bottom:6px}

/* profile */
.prof{display:grid;grid-template-columns:300px 1fr;gap:24px}
.prof-side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.prof-ava{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:var(--kc,#e7f2ff);box-shadow:inset 0 0 0 6px #fff,0 8px 20px rgba(60,90,180,.2)}
.prof-ava img{width:86%;animation:idle 3.2s ease-in-out infinite}
.prof-side h2{padding:0;margin:0;font-size:30px}
.prof-stars{display:flex;align-items:center;gap:8px;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:40px;color:#e59a00;line-height:1}
.prof-stars img{width:48px}
.prof-cap{font-weight:900;font-size:13px;color:var(--muted);margin-top:-6px}
.stat-row{align-self:stretch;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{padding:8px 4px;border-radius:14px;background:var(--panel2);text-align:center}
.stat b{display:block;font-family:Rubik,Nunito,system-ui,sans-serif;font-size:20px}
.stat span{font-size:11px;font-weight:900;color:var(--muted);line-height:1.2;display:block}
.chip-x2{padding:6px 12px;border-radius:99px;background:#fff6dc;border:2px solid #ffd56b;color:#7a5200;font-weight:900;font-size:14px}
.prof-side h3{align-self:stretch;display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:16px;color:var(--muted);margin-top:8px}
.prof-side h3 button{font-size:13px;color:var(--blue);font-weight:900;font-family:Nunito,system-ui,sans-serif}
.wallet{align-self:stretch;display:grid;gap:8px}
.wallet .note{text-align:left}
.tk-mini{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;text-align:left;background:linear-gradient(90deg,#fff4cf,#ffe7a6);border:2px solid #ffd56b;transition:transform .12s;box-shadow:0 4px 0 #f0c64f}
.tk-mini:hover{transform:translateX(3px)}
.tk-mini img{width:36px}
.tk-mini .tx{margin-right:auto;display:flex;flex-direction:column}
.tk-mini .tx span{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900}
.tk-mini .tx small{font-weight:700;font-size:12px;color:#7a5200}
.tk-mini b{font-family:Rubik,Nunito,system-ui,sans-serif;font-size:18px;color:#c77d00}
.tk-mini em{font-style:normal;font-size:12px;font-weight:900;padding:4px 9px;border-radius:99px;background:#ff5c98;color:#fff}
.prof-tools{align-self:stretch;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;padding-top:12px;border-top:2px solid var(--line)}
.prof-tools .btn{font-size:13px;padding:8px 11px}
.album-h{padding-right:56px;display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.album-h h3{font-size:20px;margin-right:auto}
.album-prog{display:flex;align-items:center;gap:10px;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:18px}
.album-prog .mini-bar{width:160px;height:12px}
.rar-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rar-legend span{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-weight:900;font-size:13px;color:#fff}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 12px;justify-items:center}
.album-grid .card{cursor:zoom-in}
.complete-banner{margin-top:16px;padding:14px;border-radius:18px;text-align:center;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:20px;background:linear-gradient(90deg,#fff1c2,#ffe0b8);border:2px solid #ffc53d;color:#7a4a00}

/* cards */
.card{--w:150px;width:var(--w);aspect-ratio:5/7;position:relative;perspective:700px;flex:none}
.card-inner{position:absolute;inset:0;border-radius:calc(var(--w)*.09);background:var(--frame);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;box-shadow:0 8px 18px rgba(30,40,90,.25),var(--outer,0 0 0 transparent),inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.15)}
.card .face{position:absolute;inset:calc(var(--w)*.055);border-radius:calc(var(--w)*.06);overflow:hidden;background:var(--bgc);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.card .face::before{content:"";position:absolute;inset:0;background:var(--pattern,none);opacity:.6}
.card .face::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-8%;height:36%;background:radial-gradient(60% 70% at 30% 100%,rgba(255,255,255,.75) 0 60%,transparent 61%),radial-gradient(60% 60% at 80% 100%,rgba(255,255,255,.6) 0 60%,transparent 61%)}
.r-c{--rc:var(--c-common);--frame:linear-gradient(160deg,#ffffff,#d7dde8);--bgc:linear-gradient(180deg,#f7f9fc,#e2e8f1);--glow:rgba(140,153,176,.6);--pattern:radial-gradient(rgba(140,153,176,.25) 1.2px,transparent 1.8px) 0 0/14px 14px}
.r-r{--rc:var(--c-rare);--frame:linear-gradient(160deg,#7fc4ff,#1f6fe6 55%,#0f4fc0);--bgc:radial-gradient(circle at 50% 38%,#e8f5ff 0,#7cc0ff 45%,#1c63d8 100%);--glow:rgba(31,124,255,.9);--outer:0 0 0 3px rgba(31,124,255,.25);--pattern:radial-gradient(rgba(255,255,255,.7) 1.2px,transparent 1.8px) 0 0/12px 12px}
.r-e{--rc:var(--c-epic);--frame:linear-gradient(160deg,#f0c8ff,#9b4dff 50%,#5f1cc4);--bgc:radial-gradient(circle at 50% 38%,#fbefff 0,#c08aff 42%,#4a12a8 100%);--glow:rgba(138,60,240,.95);--outer:0 0 18px rgba(155,77,255,.55);--pattern:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.6px) 0 0/9px 9px,radial-gradient(rgba(255,220,255,.6) 1.4px,transparent 2px) 4px 6px/17px 17px}
.r-l{--rc:var(--c-leg);--frame:linear-gradient(145deg,#fff6bf,#ffb300 36%,#fff3a8 52%,#e08600 76%,#ffe486);--bgc:radial-gradient(circle at 50% 38%,#fffbe4 0,#ffd45e 40%,#d07000 100%);--glow:rgba(255,184,31,1);--outer:0 0 24px rgba(255,184,31,.75);--pattern:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.35) 0 9deg,transparent 9deg 20deg)}
.card-art{position:absolute;left:50%;top:47%;width:72%;transform:translate(-50%,-50%);filter:drop-shadow(0 calc(var(--w)*.04) calc(var(--w)*.04) rgba(0,0,0,.3));z-index:2}
.card-rib{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:3;padding:calc(var(--w)*.018) calc(var(--w)*.06);border-radius:99px;background:var(--rc);color:#fff;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:calc(var(--w)*.062);letter-spacing:.1em;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25),inset 0 0 0 1.5px rgba(255,255,255,.5)}
.r-l .card-rib{background:linear-gradient(90deg,#ff9d00,#ffcf3a,#ff9d00);color:#5a2e00}
.card-num{position:absolute;bottom:5.5%;right:8%;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:calc(var(--w)*.06);color:rgba(30,40,90,.55);z-index:3}
.card-gems{position:absolute;bottom:5%;left:8%;font-size:calc(var(--w)*.065);color:var(--rc);text-shadow:0 0 1px #fff,0 1px 0 #fff;letter-spacing:-.05em;z-index:3}
.r-l .card-gems{color:#e08600}
.r-r .card-num,.r-e .card-num{color:rgba(255,255,255,.85)}
.r-r .card-gems,.r-e .card-gems{color:#fff;text-shadow:0 0 6px var(--glow)}
.card-name{position:absolute;left:7%;right:7%;bottom:14%;padding:calc(var(--w)*.025) 0;text-align:center;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:calc(var(--w)*.098);line-height:1.05;color:#fff;background:var(--rc);border-radius:calc(var(--w)*.05);z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.r-l .card-name{background:linear-gradient(90deg,#e08600,#ffb300,#e08600)}
.card-shine{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.55),transparent 45%);mix-blend-mode:soft-light;pointer-events:none;z-index:4}
.r-r .card-inner::after,.r-e .card-inner::after,.r-l .card-inner::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 58%);background-size:250% 100%;animation:sheen 3.4s ease-in-out infinite;mix-blend-mode:overlay}
.r-r .card-inner::after{animation-duration:5s;opacity:.7}
.r-l .card-inner::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;background:conic-gradient(rgba(255,0,140,.18),rgba(255,220,0,.18),rgba(0,255,170,.18),rgba(0,150,255,.18),rgba(200,0,255,.18),rgba(255,0,140,.18));mix-blend-mode:color-dodge;animation:huespin 6s linear infinite}
.r-l .card-art,.r-e .card-art{animation:legendart 3s ease-in-out infinite}
.card-count{position:absolute;right:-7px;top:-9px;z-index:6;min-width:34px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:linear-gradient(180deg,#ff8fb1,#ff4f86);color:#fff;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:15px;box-shadow:0 4px 10px rgba(255,80,130,.4);border:2px solid #fff}
.card.locked .card-inner{filter:saturate(.35) brightness(.92);opacity:.55}
.card.locked .card-art{filter:brightness(0) opacity(.35)}
.card.locked .card-inner::after,.card.locked .card-inner::before{display:none}
.card.sel .card-inner{box-shadow:0 0 0 5px var(--gold),0 0 30px rgba(255,184,31,.7)}
.card-back{--frame:linear-gradient(145deg,#ffffff,#a9c6ff 45%,#ffffff 60%,#7ea6f2)}
.card-back .face{background:radial-gradient(circle at 50% 45%,#5aa8ff 0,#3457d8 55%,#22308f 100%);display:grid;place-items:center}
.card-back .face::before{background:radial-gradient(rgba(255,255,255,.5) 1.2px,transparent 1.8px) 0 0/14px 14px;opacity:.5}
.card-back .face::after{display:none}
.back-logo{width:58%;filter:drop-shadow(0 0 16px rgba(200,235,255,.9));animation:spinslow 14s linear infinite;z-index:2}
.back-t{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:calc(var(--w)*.1);line-height:1;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 rgba(20,30,100,.5)}

/* tickets */
.ticket{--h:74px;display:flex;align-items:stretch;height:var(--h);border-radius:14px;background:linear-gradient(135deg,#fff3a8,#ffc53d 45%,#ffe58a 60%,#e99a00);color:#3a2300;box-shadow:0 8px 20px rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.5);position:relative;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 11px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 12px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 50%,transparent 11px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 12px) right/51% 100% no-repeat}
.tk-l{width:var(--h);display:grid;place-items:center;border-right:2px dashed rgba(90,50,0,.35)}
.tk-l img{width:66%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.tk-r{padding:0 22px 0 14px;display:flex;flex-direction:column;justify-content:center;text-align:left}
.tk-k{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:800;font-size:10px;letter-spacing:.16em;opacity:.7}
.tk-n{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:22px;line-height:1.05}
.tk-d{font-weight:800;font-size:12px;opacity:.8;margin-top:2px}
.ticket.big{--h:150px}
.ticket.big .tk-k{font-size:15px}.ticket.big .tk-n{font-size:44px}.ticket.big .tk-r{padding:0 40px 0 26px}
.ticket::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 48%,transparent 60%);background-size:250% 100%;animation:sheen 2.6s ease-in-out infinite;mix-blend-mode:overlay}

/* stage */
.stage{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;transition:opacity .3s;overflow:hidden;color:#fff}
.stage.in{opacity:1}.stage.out{opacity:0}
.stage>*{position:relative}
.stage>.stage-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#4a6cff 0,#2a2f9a 45%,#140f4f 100%)}
.stage>.stage-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.6) 1px,transparent 1.6px) 0 0/40px 40px,radial-gradient(rgba(255,255,255,.4) 1px,transparent 1.6px) 20px 20px/60px 60px;opacity:.5}
.stage.quake{animation:quake .5s}
.stage-title{display:flex;align-items:center;gap:12px;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(26px,3vw,40px);text-shadow:0 4px 0 rgba(0,0,0,.25)}
.stage-title img{width:clamp(54px,5vw,74px)}
.stage-hint{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:800;font-size:22px;color:#cfe0ff;min-height:30px;animation:pulse 1.4s ease-in-out infinite}
.stage-ctrl{display:flex;gap:12px;min-height:60px;align-items:center}
.stage-ctrl .btn:not(.gold){background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none}
.stage-x{position:absolute!important;top:16px;right:16px;z-index:5;color:var(--ink)}
.pack-zone{perspective:900px}
.pack{width:250px;height:350px;position:relative;cursor:pointer;animation:packin .7s cubic-bezier(.3,1.5,.5,1),float 2.6s ease-in-out .7s infinite;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)) drop-shadow(0 0 40px rgba(160,200,255,.6))}
.pack-body{position:absolute;inset:44px 0 0 0;border-radius:0 0 10px 10px;background:linear-gradient(160deg,#a4f5ff 0%,#5b8dff 28%,#9a5cff 58%,#ff7fb5 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.pack-top{position:absolute;left:0;right:0;top:0;height:46px;border-radius:10px 10px 0 0;background:linear-gradient(160deg,#d5fdff,#86b3ff);overflow:hidden;transform-origin:85% 100%}
.crimp{position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 5px,rgba(0,0,40,.18) 5px 10px)}
.crimp.bottom{top:auto;bottom:0;border-radius:0 0 10px 10px}
.pack-top::after{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:2px dashed rgba(255,255,255,.8)}
.pack-season{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:13px;letter-spacing:.3em;color:rgba(255,255,255,.9)}
.pack-emblem{width:120px;filter:drop-shadow(0 0 20px rgba(255,255,255,.8));animation:spinslow 10s linear infinite}
.pack-name{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:40px;line-height:.95;text-align:center;color:#fff;-webkit-text-stroke:2px #2a2f9a;paint-order:stroke fill;text-shadow:0 5px 0 #2a2f9a}
.pack-sub{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:15px;color:#fff;background:rgba(20,20,90,.35);padding:4px 12px;border-radius:99px}
.pack-foil{position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 58%);background-size:250% 100%;animation:sheen 2.4s ease-in-out infinite;mix-blend-mode:overlay}
.pack.shake{animation:packshake .65s}
.pack.torn .pack-top{animation:tear .5s forwards}
.pack.drop{animation:packdrop .4s forwards}
.flash{position:absolute!important;inset:0;background:#fff;pointer-events:none;animation:flash .5s forwards;z-index:9}
.reveal-row{display:flex;gap:clamp(14px,2.5vw,40px);perspective:1200px;flex-wrap:wrap;justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:12px;animation:deal .55s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*.15s)}
.flip{position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.35,.5,1);cursor:pointer}
.flip.on{transform:rotateY(180deg);cursor:default}
.flip:not(.on):hover{transform:translateY(-8px) rotate(-1deg)}
.flip .side{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .side.front{position:absolute;inset:0;transform:rotateY(180deg)}
.side.back.glow-r .card{filter:drop-shadow(0 0 18px rgba(80,170,255,1))}
.side.back.glow-e .card{filter:drop-shadow(0 0 24px rgba(190,120,255,1))}
.side.back.glow-l .card{filter:drop-shadow(0 0 32px rgba(255,200,60,1));animation:wiggle .9s ease-in-out infinite}
.slot-badges{min-height:44px;display:flex;flex-direction:column;align-items:center;gap:8px}
.badge{padding:6px 14px;border-radius:99px;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:16px;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
.badge.new{background:linear-gradient(180deg,#a7ffd9,#2fd69a);color:#053b28}
.badge.dup{background:rgba(255,255,255,.18);color:#fff}
.badge.rar{color:#fff;box-shadow:0 0 18px var(--glow)}
.tk-chip{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:12px;background:linear-gradient(135deg,#fff3a8,#ffc53d);color:#3a2300;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:tkdrop .7s cubic-bezier(.3,1.6,.5,1);text-align:left}
.tk-chip img{width:30px}
.tk-chip small{display:block;font-family:Nunito,system-ui,sans-serif;font-size:11px;font-weight:800;opacity:.8}
.rays{position:absolute;left:50%;top:50%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.35) 0 8deg,transparent 8deg 18deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:spin 14s linear infinite,fade .6s}
.rays.purple{background:repeating-conic-gradient(from 0deg,rgba(210,160,255,.35) 0 8deg,transparent 8deg 18deg)}
.rays.blue{background:repeating-conic-gradient(from 0deg,rgba(140,200,255,.3) 0 8deg,transparent 8deg 18deg)}
.ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:6px solid #fff;pointer-events:none;animation:ring .8s ease-out forwards}
.chooser{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 24px;border-radius:26px;background:#fff;color:var(--ink);border:4px solid #ffc53d;box-shadow:0 0 60px rgba(255,200,60,.55);animation:popin .4s cubic-bezier(.3,1.5,.5,1);z-index:6;max-width:92vw}
.chooser h3{font-size:24px;color:#c77d00}
.chooser .tks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chooser .tks button{transition:transform .15s}
.chooser .tks button:hover{transform:translateY(-6px) rotate(-2deg)}
.use-ticket{animation:tkspin 1.1s cubic-bezier(.3,1.3,.5,1)}
.use-text{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(36px,5vw,64px);text-align:center;text-shadow:0 5px 0 rgba(0,0,0,.25);animation:popin .5s .4s both cubic-bezier(.3,1.6,.5,1)}
.use-sub{font-weight:800;font-size:22px;color:#dbe6ff;text-align:center;animation:fade .5s .7s both;max-width:760px}
.big-ava{width:clamp(160px,22vh,240px);filter:drop-shadow(0 20px 30px rgba(0,0,0,.35));animation:jump 1s cubic-bezier(.3,1.6,.5,1)}
.forge-zone{position:relative;width:min(700px,90vw);height:260px;display:flex;align-items:center;justify-content:center;gap:24px}
.forge-zone .fg{transition:transform 1s cubic-bezier(.6,0,.3,1),opacity .9s}
.forge-zone.merge .fg{opacity:0}
.forge-zone.merge .fg:nth-child(1){transform:translateX(160px) scale(.2) rotate(360deg)}
.forge-zone.merge .fg:nth-child(2){transform:scale(.2) rotate(-360deg)}
.forge-zone.merge .fg:nth-child(3){transform:translateX(-160px) scale(.2) rotate(360deg)}
.forge-orb{position:absolute!important;left:50%;top:50%;width:140px;height:140px;margin:-70px;display:grid;place-items:center;opacity:0;transition:opacity .6s .5s,transform 1s .5s}
.forge-orb img{width:100%;filter:drop-shadow(0 0 40px rgba(220,170,255,1))}
.forge-zone.merge .forge-orb{opacity:1;transform:scale(1.4)}
.swap-zone{display:flex;align-items:center;gap:40px}
.swap-zone .sw{display:flex;flex-direction:column;align-items:center;gap:10px;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:22px}
.swap-zone .sw img.av{width:70px}
.swap-arrow{font-size:60px;animation:pulse 1s infinite}

/* six seven */
.secret{position:fixed;right:14px;bottom:14px;z-index:30;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.5);border:2px dashed #c9d6f5;opacity:.35;transition:opacity .2s,transform .2s}
.secret:hover{opacity:1;transform:scale(1.15) rotate(-10deg)}
.stage.sixseven>.stage-bg{background:radial-gradient(circle at 50% 60%,#ffe27a 0,#ff8fb1 40%,#9b5cff 75%,#4f2bd1 100%)}
.ss-num{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(120px,22vh,240px);line-height:1;height:clamp(130px,24vh,260px);display:flex;align-items:center;justify-content:center;gap:40px;color:#fff;text-shadow:0 10px 0 rgba(60,20,120,.35),0 0 40px rgba(255,255,255,.6)}
.ss-num span{display:inline-block;opacity:.18;transform:scale(.7);transition:transform .16s cubic-bezier(.3,1.8,.5,1),opacity .16s}
.ss-num span.on{opacity:1;transform:scale(1.15) rotate(-4deg)}
.ss-num span.on.b{transform:scale(1.15) rotate(4deg)}
.ss-hands{display:flex;gap:clamp(40px,10vw,160px);align-items:center;height:clamp(240px,36vh,380px)}
.ss-hand{width:clamp(180px,24vh,280px);transition:transform .3s cubic-bezier(.45,0,.3,1.4);filter:drop-shadow(0 24px 24px rgba(60,20,120,.4))}
.ss-hand.r{transform:scaleX(-1)}
.ss-hand.up{transform:translateY(-90px) rotate(-10deg)}
.ss-hand.dn{transform:translateY(60px) rotate(8deg)}
.ss-hand.r.up{transform:scaleX(-1) translateY(-90px) rotate(-10deg)}
.ss-hand.r.dn{transform:scaleX(-1) translateY(60px) rotate(8deg)}
.ss-final{font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(40px,6vw,80px);color:#fff;text-shadow:0 6px 0 rgba(60,20,120,.35);min-height:1.2em}
.ss-final.go{animation:popin .5s cubic-bezier(.3,1.8,.5,1)}

/* trade */
.trade{display:grid;grid-template-columns:1fr 250px 1fr;gap:16px}
.tcol{padding:14px;border-radius:22px;background:var(--panel2);min-height:300px}
.tcol h3{font-size:16px;color:var(--muted);margin-bottom:8px}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.who button{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;padding:6px 4px;border-radius:16px;border:3px solid transparent;background:#fff;font-weight:900;font-size:12px}
.who button img{width:42px}
.who button.sel{border-color:var(--gold);background:#fff6dc}
.who button span{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;justify-items:center;max-height:440px;overflow:auto;padding:12px 6px}
.tcards .card{cursor:pointer}
.tmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.phr{width:100%;padding:14px;border-radius:18px;background:#e6fbf3;border:2px solid #9becd0;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:800;font-size:17px;line-height:1.5}
.phr small{display:block;color:#0c8a62;font-family:Nunito,system-ui,sans-serif;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.last{font-size:12px;font-weight:900;color:#d0264f}

/* history */
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--panel2);margin-bottom:8px}
.hist-item .t{color:var(--dim);font-weight:900;font-size:13px;width:44px}
.hist-item .l{flex:1;font-weight:800;font-size:15px}
.hist-item.undone .l{text-decoration:line-through;opacity:.5}
.hist-item .btn{padding:7px 10px;font-size:13px}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:18px;background:#1d2a5c;color:#fff;box-shadow:0 14px 40px rgba(30,40,100,.4);font-weight:800;animation:toastin .3s cubic-bezier(.3,1.5,.5,1);max-width:90vw}
.toast.err{background:#c8234b}
.toast .btn{padding:7px 12px;font-size:14px}
.toast.out{animation:toastout .3s forwards}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.fly{position:fixed;width:50px;height:50px;filter:drop-shadow(0 4px 10px rgba(255,170,0,.6))}
.spark{position:fixed;width:10px;height:10px;border-radius:50%}
.conf{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:Rubik,Nunito,system-ui,sans-serif;font-weight:800;font-size:20px;color:var(--muted)}
.loading img{width:90px;animation:spinslow 3s linear infinite}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-26px) scale(1.12) rotate(-8deg)}60%{transform:translateY(0) scale(.95,1.05)}80%{transform:translateY(-6px) rotate(4deg)}100%{transform:none}}
@keyframes crazy{0%{transform:translate(-8px,-14px) rotate(-22deg) scale(1.1)}50%{transform:translate(10px,-30px) rotate(18deg) scale(1.2)}100%{transform:translate(-4px,4px) rotate(-10deg) scale(.95)}}
@keyframes jitter{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,2px) rotate(-1.5deg)}50%{transform:translate(3px,-2px) rotate(1.5deg)}75%{transform:translate(-2px,-3px) rotate(-1deg)}100%{transform:translate(0,0)}}
@keyframes redpulse{from{filter:none}to{filter:hue-rotate(-60deg) saturate(1.6)}}
@keyframes zzz{0%{transform:translate(0,0) scale(.8);opacity:0}30%{opacity:1}100%{transform:translate(14px,-26px) scale(1.2);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes aurora{to{background-position:200% 0}}
@keyframes stripes{to{background-position:44px 0}}
@keyframes sheen{0%{background-position:150% 0}55%,100%{background-position:-50% 0}}
@keyframes huespin{to{filter:hue-rotate(360deg)}}
@keyframes legendart{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-54%) scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinslow{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes kidpop{0%{transform:scale(1)}35%{transform:scale(1.08) rotate(-1.5deg)}70%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes numpop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes modalin{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes toastin{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(20px)}}
@keyframes packin{from{transform:translateY(120vh) rotate(25deg) scale(.6)}to{transform:none}}
@keyframes packshake{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg) scale(1.03)}20%{transform:rotate(6deg)}30%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg)}50%{transform:rotate(-10deg) scale(1.07)}60%{transform:rotate(10deg)}70%{transform:rotate(-6deg) scale(1.08)}85%{transform:rotate(4deg)}}
@keyframes tear{to{transform:translate(90px,-200px) rotate(38deg);opacity:0}}
@keyframes packdrop{to{transform:translateY(80vh) scale(.8);opacity:0}}
@keyframes flash{from{opacity:.95}to{opacity:0}}
@keyframes deal{from{opacity:0;transform:translateY(-70vh) rotate(-30deg) scale(.5)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.03)}}
@keyframes ring{to{width:520px;height:520px;margin:-260px;opacity:0;border-width:2px}}
@keyframes tkdrop{from{opacity:0;transform:translateY(-80px) rotate(-20deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes tkspin{from{transform:perspective(800px) rotateY(-540deg) scale(.2);opacity:0}to{transform:perspective(800px) rotateY(0) scale(1);opacity:1}}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-10px,6px)}40%{transform:translate(10px,-6px)}60%{transform:translate(-8px,-4px)}80%{transform:translate(6px,4px)}}

@media (max-width:900px){
  .prof{grid-template-columns:1fr}
  .trade{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}

</style>
</head>

const TICKETS={
 dj:{n:'DJ',img:'t_dj',w:22,en:'DJ time!',ua:'Обирає пісню для руханки або перерви'},
 game:{n:'Game Choice',img:'t_game',w:18,en:'You choose the game!',ua:'Обирає гру, в яку сьогодні грає клас'},

const CLASS_EMOJI=['❄️','⛄','🎄','🦌','🐧','⭐','🔔','🎁','🦊','🐻‍❄️','🌙','🍪'];

const KC=[['#ffd6e7','#ff6fa5'],['#d3ecff','#4f9dff'],['#d4f7e8','#2fd6a3'],['#fff0bf','#ffb81f'],['#e9ddff','#9b5cff'],['#ffe0cc','#ff8a4c'],['#d6f5ff','#22b8e0'],['#f3dcff','#c94dff']];
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);};

/* ---------- state ---------- */
const S={classes:{},students:{},history:{},settings:Object.assign({},DEF),ready:false,mode:'loading'};

/* ---------- storage ---------- */
let db=null;const wq={};
function busy(p){const q=wq[p];return !!(q&&(q.busy||q.next));}
function put(path,data){
  if(!db||S.mode!=='db')return;
  const q=wq[path]||(wq[path]={busy:false,next:null});
  const copy=JSON.parse(JSON.stringify(data));delete copy.id;
  q.next=copy;if(!q.busy)flush(path);
}
function del(path){if(!db||S.mode!=='db')return;db.doc(path).delete().catch(saveError);}
async function flush(path){
  const q=wq[path];q.busy=true;
  while(q.next){
    const d=q.next;q.next=null;let tries=0;
    while(true){
      try{await db.doc(path).set(d);break;}
      catch(e){
        if(e&&e.code==='unavailable'&&tries++<2){await sleep(500+Math.random()*800);continue;}
        saveError(e);break;
      }
    }
  }
  q.busy=false;
}
let lastErr=0;
function saveError(e){
  console.warn(e);
  if(Date.now()-lastErr<4000)return;lastErr=Date.now();
  const code=e&&e.code;
  toast(code==='quota_exceeded'?'⚠️ База переповнена, дані не збереглися':'⚠️ Не вдалося зберегти зміну. Перевірте інтернет.',{err:true});
}
async function getClaude(){for(let i=0;i<40;i++){if(window.claude&&window.claude.use)return window.claude;await sleep(100);}return null;}
async function init(){
  render();
  const timer=setTimeout(()=>{if(!S.ready){S.mode='slow';render();}},10000);
  const cl=await getClaude();
  try{db=cl?await cl.use('db'):null;}catch(e){db=null;}
  if(!db){clearTimeout(timer);S.mode='local';S.ready=true;render();return;}
  const seen=new Set();
  const ok=k=>{seen.add(k);if(seen.size>=4&&(!S.ready||S.mode==='slow')){S.ready=true;S.mode='db';clearTimeout(timer);}schedule();};
  const fail=e=>{console.warn(e);clearTimeout(timer);if(!S.ready||S.mode==='slow'){S.mode='error';S.ready=true;}else toast('⚠️ Зв\'язок з базою втрачено. Оновіть сторінку.',{err:true});schedule();};
  const sub=(col,store)=>db.collection(col).onSnapshot(snap=>{
    const ids=new Set();
    snap.docs.forEach(d=>{ids.add(d.id);if(busy(col+'/'+d.id))return;store[d.id]=Object.assign({},d.data(),{id:d.id});});
    Object.keys(store).forEach(id=>{if(!ids.has(id)&&!busy(col+'/'+id))delete store[id];});
    ok(col);
  },fail);
  sub('classes',S.classes);sub('students',S.students);sub('history',S.history);
  db.doc('settings/main').onSnapshot(snap=>{
    if(!busy('settings/main'))S.settings=Object.assign({},DEF,snap.exists?snap.data():{});
    ok('settings');
  },fail);
}

/* ---------- model helpers ---------- */
const kidsOf=cid=>Object.values(S.students).filter(s=>s.classId===cid&&!s.archived).sort((a,b)=>(a.order||0)-(b.order||0));
const lessonKey=c=>{const t=today();return(c&&c.lessonKey&&c.lessonKey.indexOf(t)===0)?c.lessonKey:t;};
const lessonOf=st=>{const c=S.classes[st.classId];return(c&&st.lessonKey===lessonKey(c))?(st.lesson||0):0;};
const uniq=st=>CARDS.filter(c=>(st.cards||{})[c.id]>0).length;
const extras=st=>CARDS.reduce((s,c)=>s+Math.max(0,((st.cards||{})[c.id]||0)-1),0);
const tkCount=st=>TK.reduce((s,t)=>s+((st.tickets||{})[t]||0),0);
const classGoal=c=>c.goal>0?c.goal:Math.max(1,S.settings.goalPerKid*kidsOf(c.id).length);
const classSum=cid=>kidsOf(cid).reduce((s,k)=>s+(k.earned||0),0);
function saveStudent(st){S.students[st.id]=st;put('students/'+st.id,st);}
function saveClass(c){S.classes[c.id]=c;put('classes/'+c.id,c);}
function saveSettings(){put('settings/main',S.settings);}

function applyDelta(st,d,sign){
  const n=Object.assign({},st,{cards:Object.assign({},st.cards||{}),tickets:Object.assign({},st.tickets||{})});
  ['stars','earned','packs'].forEach(k=>{if(d[k])n[k]=Math.max(0,(n[k]||0)+sign*d[k]);});
  if(d.lesson){
    const key=lessonKey(S.classes[st.classId]);
    if(sign>0){if(n.lessonKey!==key){n.lessonKey=key;n.lesson=0;}n.lesson=Math.max(0,(n.lesson||0)+d.lesson);}
    else if(n.lessonKey===key)n.lesson=Math.max(0,(n.lesson||0)-d.lesson);
  }
  ['cards','tickets'].forEach(m=>{if(d[m])Object.keys(d[m]).forEach(k=>{n[m][k]=Math.max(0,(n[m][k]||0)+sign*d[m][k]);if(!n[m][k])delete n[m][k];});});
  if(d.dbl)n.double=sign*d.dbl>0;
  if(d.arch)n.archived=sign*d.arch>0;
  return n;
}
function writeHist(cid,items){S.history[cid]={id:cid,items};put('history/'+cid,{items});}
function act(cid,label,deltas,opt){
  opt=opt||{};
  deltas.forEach(dl=>{const st=S.students[dl.sid];if(st)saveStudent(applyDelta(st,dl,1));});
  const item={id:uid(),t:Date.now(),label,d:deltas,undone:false};
  const h=S.history[cid];
  writeHist(cid,[item].concat((h&&h.items)||[]).slice(0,80));
  if(opt.toast!==false)toast(label,{undo:()=>undoItem(cid,item.id)});
  schedule();
  return item;
}
function undoItem(cid,id,redo){
  const h=S.history[cid];if(!h)return;
  const it=(h.items||[]).find(x=>x.id===id);if(!it)return;
  if(!redo&&it.undone)return;if(redo&&!it.undone)return;
  it.d.forEach(dl=>{const st=S.students[dl.sid];if(st)saveStudent(applyDelta(st,dl,redo?1:-1));});
  writeHist(cid,h.items.map(x=>x.id===id?Object.assign({},x,{undone:!redo}):x));
  toast((redo?'↷ Повернуто: ':'↶ Скасовано: ')+it.label);
  sfx.pop();schedule();
}
function addTicketToItem(cid,itemId,sid,tid){
  const st=S.students[sid];if(!st)return;
  saveStudent(applyDelta(st,{tickets:{[tid]:1}},1));
  const h=S.history[cid];if(!h)return;
  writeHist(cid,h.items.map(x=>{
    if(x.id!==itemId)return x;
    return Object.assign({},x,{d:x.d.map(dl=>{
      if(dl.sid!==sid)return dl;const t=Object.assign({},dl.tickets||{});t[tid]=(t[tid]||0)+1;return Object.assign({},dl,{tickets:t});
    })});
  }));
}
function rollRarity(pool){
  const rs=['c','r','e','l'].filter(r=>!pool||pool.some(c=>c.r===r));
  const tot=rs.reduce((s,r)=>s+RAR[r].w,0);let x=Math.random()*tot;
  for(const r of rs){x-=RAR[r].w;if(x<0)return r;}return rs[0];
}
function rollCard(pool){pool=pool||CARDS;const r=rollRarity(pool);return rnd(pool.filter(c=>c.r===r));}
function rollTicket(){const tot=TK.reduce((s,t)=>s+TICKETS[t].w,0);let x=Math.random()*tot;for(const t of TK){x-=TICKETS[t].w;if(x<0)return t;}return TK[0];}

/* ---------- actions ---------- */
function tileRect(sid){const el=document.querySelector('.kid[data-id="'+sid+'"]');return el?el.getBoundingClientRect():null;}
function award(sid,ruleId,fromRect){
  const st=S.students[sid];if(!st)return;
  const cap=S.settings.lessonCap;
  if(lessonOf(st)>=cap){toast(st.name+' вже має '+cap+'/'+cap+' ⭐ за цей урок');shakeTile(sid);sfx.no();return;}
  const amt=st.double?2:1;const rule=RULES.find(r=>r.id===ruleId);
  const d={sid,stars:amt,earned:amt,lesson:amt};if(st.double)d.dbl=-1;
  const before=classSum(st.classId);
  flyStars(fromRect,tileRect(sid),amt,()=>{UI.pop[sid]=Date.now();schedule();praise(sid);});
  act(st.classId,'⭐ '+st.name+' +'+amt+' · '+rule.e+' '+rule.n,[d]);
  sfx.star(amt);
  checkGoal(st.classId,before);
}
function teamStar(cid,fromRect,label){
  const cap=S.settings.lessonCap;const deltas=[];
  kidsOf(cid).forEach(st=>{if(lessonOf(st)<cap)deltas.push({sid:st.id,stars:1,earned:1,lesson:1});});
  if(!deltas.length){toast('Усі вже мають максимум зірочок за урок');return false;}
  const before=classSum(cid);
  deltas.forEach((d,i)=>{const tr=tileRect(d.sid);setTimeout(()=>flyStars(fromRect,tr,1,()=>{UI.pop[d.sid]=Date.now();schedule();}),i*80);});
  act(cid,(label||'🌟 Team star')+': +1 ⭐ для '+deltas.length+' учнів',deltas);
  sfx.team();
  checkGoal(cid,before);
}
function checkGoal(cid,before){
  const c=S.classes[cid];if(!c)return;const g=classGoal(c);
  if(before<g&&classSum(cid)>=g)setTimeout(()=>showGoal(c),900);
}
function openPack(sid){
  const st=S.students[sid];if(!st)return;const price=S.settings.packPrice;
  if((st.stars||0)<price){toast('Для паку потрібно '+price+' ⭐, у '+st.name+' зараз '+(st.stars||0));sfx.no();return;}
  closePop();
  const owned=Object.assign({},st.cards||{});
  const res=[rollCard(),rollCard(),rollCard()].map(c=>{
    const isNew=!owned[c.id];owned[c.id]=(owned[c.id]||0)+1;
    return {card:c,isNew,count:owned[c.id],ticket:c.r==='e'?rollTicket():null,choose:c.r==='l'};
  });
  const cards={},tickets={};
  res.forEach(r=>{cards[r.card.id]=(cards[r.card.id]||0)+1;if(r.ticket)tickets[r.ticket]=(tickets[r.ticket]||0)+1;});
  const item=act(st.classId,'🎁 '+st.name+': пак (−'+price+' ⭐) → '+res.map(r=>r.card.n).join(', '),[{sid,stars:-price,packs:1,cards,tickets}],{toast:false});
  showPack(st,res,item);
}
function forge(sid,picks){
  const st=S.students[sid];if(!st||picks.length!==3)return;
  const cnt={};picks.forEach(id=>cnt[id]=(cnt[id]||0)+1);
  for(const id in cnt){if(((st.cards||{})[id]||0)-cnt[id]<1){toast('Можна віддавати тільки зайві копії');return;}}
  const missing=CARDS.filter(c=>!(st.cards||{})[c.id]);
  const card=missing.length?rollCard(missing):rollCard();
  const cards={};picks.forEach(id=>cards[id]=(cards[id]||0)-1);cards[card.id]=(cards[card.id]||0)+1;
  const res={card,isNew:!(st.cards||{})[card.id],count:((st.cards||{})[card.id]||0)+1,ticket:card.r==='e'?rollTicket():null,choose:card.r==='l'};
  const tickets={};if(res.ticket)tickets[res.ticket]=1;
  const item=act(st.classId,'🔮 '+st.name+': 3 дублікати → '+card.n,[{sid,cards,tickets}],{toast:false});
  closeModal();
  showForge(st,picks,res,item);
}
function trade(a,ca,b,cb){
  const A1=S.students[a],B1=S.students[b];if(!A1||!B1)return;
  if(!((A1.cards||{})[ca]>0)||!((B1.cards||{})[cb]>0))return;
  const da={sid:a,cards:{}},dbb={sid:b,cards:{}};
  da.cards[ca]=(da.cards[ca]||0)-1;da.cards[cb]=(da.cards[cb]||0)+1;
  dbb.cards[cb]=(dbb.cards[cb]||0)-1;dbb.cards[ca]=(dbb.cards[ca]||0)+1;
  Object.keys(da.cards).forEach(k=>{if(!da.cards[k])delete da.cards[k];});
  Object.keys(dbb.cards).forEach(k=>{if(!dbb.cards[k])delete dbb.cards[k];});
  act(A1.classId,'🔄 Обмін: '+A1.name+' ('+CARD[ca].n+') ⇄ '+B1.name+' ('+CARD[cb].n+')',[da,dbb]);
  showSwap(A1,ca,B1,cb);
}
function useTicket(sid,tid,friend){
  const st=S.students[sid];if(!st||!((st.tickets||{})[tid]>0))return;
  const d={sid,tickets:{[tid]:-1}};if(tid==='double')d.dbl=1;
  const deltas=[d];const fr=friend?S.students[friend]:null;
  if(tid==='gift'&&fr)deltas.push({sid:fr.id,stars:1,earned:1});
  act(st.classId,'🎟 '+st.name+': '+TICKETS[tid].n+(fr?' → '+fr.name:''),deltas,{toast:false});
  closeModal();
  showTicketUse(st,tid,fr);
}
function correct(sid,n){
  const st=S.students[sid];if(!st)return;
  if(n<0&&!(st.stars>0)){toast('Зірочок вже 0');return;}
  act(st.classId,'✏️ Корекція: '+st.name+' '+(n>0?'+':'')+n+' ⭐',[{sid,stars:n,earned:n}]);
}
function archiveKid(sid){
  const st=S.students[sid];if(!st)return;
  act(st.classId,'🗄 '+st.name+' переміщено в архів',[{sid,arch:1}]);
}
function restoreKid(sid){
  const st=S.students[sid];if(!st)return;
  act(st.classId,'♻️ '+st.name+' повернуто з архіву',[{sid,arch:-1}]);
}
function undoLatest(){
  if(UI.view!=='class')return;const h=S.history[UI.classId];if(!h)return;
  const it=(h.items||[]).find(x=>!x.undone);if(it)undoItem(UI.classId,it.id);else toast('Немає дій для скасування');

/* ---------- engagement ---------- */
function praise(sid){
  const r=tileRect(sid);if(!r)return;
  const b=document.createElement('div');b.className='bubble';b.textContent=rnd(PRAISE);fx.appendChild(b);
  const w=b.offsetWidth;b.style.left=(r.left+r.width/2-w/2)+'px';b.style.top=(r.top-30)+'px';
  b.animate([{transform:'translateY(10px) scale(.5)',opacity:0},{transform:'translateY(-6px) scale(1.1)',opacity:1,offset:.2},{transform:'translateY(-10px) scale(1)',opacity:1,offset:.8},{transform:'translateY(-30px) scale(.9)',opacity:0}],{duration:1600,easing:'ease-out'}).onfinish=()=>b.remove();
}
let shh=null;
function startShh(){
  if(shh||UI.busy)return;closePop();
  const cid=UI.classId,secs=Math.max(3,S.settings.shhSecs||10);
  const bar=document.createElement('div');bar.className='shh-bar';
  bar.innerHTML='<div class="shh-t">🤫 Too loud! Freeze!<small>Клас має затихнути, поки не скінчився час. Натисніть «Тихо!», коли всі замовкли.</small></div><div class="shh-n">'+secs+'</div><button class="btn mint big" id="shok">✓ Тихо!</button><button class="ibtn" id="shx" title="Скасувати">✕</button>';
  document.body.appendChild(bar);document.body.classList.add('noisy');sfx.alarm();
  let left=secs;const n=bar.querySelector('.shh-n');
  const end=()=>{clearInterval(shh.iv);document.body.classList.remove('noisy');document.removeEventListener('keydown',shh.key);shh=null;};
  const fin=(html,cls,ms)=>{bar.classList.add(cls);bar.innerHTML=html;setTimeout(()=>{bar.style.transition='opacity .3s';bar.style.opacity='0';setTimeout(()=>bar.remove(),320);},ms);};
  const ok=()=>{if(!shh)return;end();document.body.classList.add('sleepy');sfx.lullaby();
    fin('<div class="shh-t">😴 Shhh… Great job, class!<small>Усі отримують +1 зірочку</small></div>','ok',2800);
    setTimeout(()=>{teamStar(cid,bar.getBoundingClientRect(),'🤫 Shh challenge');},700);
    setTimeout(()=>document.body.classList.remove('sleepy'),3200);};
  const fail=()=>{if(!shh)return;end();sfx.no();fin('<div class="shh-t">😅 Oh no! Time is up<small>Цього разу без зірочки. Спробуємо ще!</small></div>','fail',2400);};
  const cancel=()=>{if(!shh)return;end();bar.remove();};
  shh={iv:setInterval(()=>{left--;n.textContent=Math.max(0,left);n.style.setProperty('--p',(left/secs*100)+'%');if(left>0)sfx.tick(left<=3);else fail();},1000),
       key:e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();ok();}}};
  document.addEventListener('keydown',shh.key);
  bar.querySelector('#shok').onclick=ok;bar.querySelector('#shx').onclick=cancel;
}
async function pickRandom(){
  if(UI.busy||shh)return;closePop();
  const kids=kidsOf(UI.classId);if(!kids.length)return;
  let pool=kids.filter(k=>!UI.picked.has(k.id));if(!pool.length){UI.picked.clear();pool=kids;}
  const win=rnd(pool);UI.picked.add(win.id);UI.busy=true;
  const ids=kids.map(k=>k.id);const wi=ids.indexOf(win.id);

let AC=null;
function ac(){if(UI.muted)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tone(f,t0,dur,type,vol,slide){
  const a=ac();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(t0,dur,vol,freq){
  const a=ac();if(!a)return;const t=a.currentTime+t0;
  const len=Math.floor(a.sampleRate*dur);const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1500;f.Q.value=.8;
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur);
}

/* ---------- fx ---------- */
const fx=$('#fx');
function flyStars(fr,tr,n,done){
  if(!fr||!tr){done&&done();return;}
  for(let i=0;i<n;i++){
    const s=document.createElement('img');s.src=A.u_star;s.className='fly';
    const x0=fr.left+fr.width/2-24,y0=fr.top+fr.height/2-24,x1=tr.left+tr.width/2-24,y1=tr.top+tr.height*.62-24;
    s.style.left=x0+'px';s.style.top=y0+'px';fx.appendChild(s);
    const dx=x1-x0,dy=y1-y0;
    const an=s.animate([
      {transform:'translate(0,0) scale(.4) rotate(0deg)',opacity:0},
      {transform:'translate('+dx*.3+'px,'+(dy*.3-140)+'px) scale(1.8) rotate(160deg)',opacity:1,offset:.45},
      {transform:'translate('+dx+'px,'+dy+'px) scale(.7) rotate(360deg)',opacity:1}
    ],{duration:780,delay:i*170,easing:'cubic-bezier(.5,0,.4,1)',fill:'both'});
    an.onfinish=()=>{s.remove();sparkle(x1+24,y1+24,'#ffd45c',14);if(i===n-1&&done)done();};
  }
}
function sparkle(x,y,col,n){
  for(let i=0;i<(n||12);i++){
    const p=document.createElement('div');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';
    p.style.background=col||'#fff';p.style.boxShadow='0 0 8px '+(col||'#fff');fx.appendChild(p);
    const a=Math.random()*Math.PI*2,d=40+Math.random()*80;
    p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate('+(Math.cos(a)*d-5)+'px,'+(Math.sin(a)*d-5)+'px) scale(0)',opacity:0}],{duration:600+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}
function confetti(n,cols){
  cols=cols||['#ffd45c','#5ef2d6','#7aa8ff','#c58bff','#ff8fb1','#ffffff'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='conf';p.style.left=Math.random()*100+'vw';p.style.background=rnd(cols);
    if(Math.random()<.3){p.style.borderRadius='50%';p.style.width=p.style.height='10px';}
    fx.appendChild(p);
    const drift=(Math.random()-.5)*260,rot=(Math.random()*4-2)*360;
    p.animate([{transform:'translate(0,0) rotate(0)'},{transform:'translate('+drift+'px,'+(innerHeight+60)+'px) rotate('+rot+'deg)'}],{duration:2200+Math.random()*1800,delay:Math.random()*500,easing:'cubic-bezier(.25,.4,.5,1)',fill:'both'}).onfinish=()=>p.remove();
  }
}

/* ---------- popover ---------- */
const pop=$('#pop');let popSid=null;
function openPop(sid,anchor){
  const st=S.students[sid];if(!st)return;popSid=sid;
  const cap=S.settings.lessonCap,ls=lessonOf(st),price=S.settings.packPrice;
  pop.innerHTML='<div class="pop-h"><img src="'+A[st.avatar]+'" alt=""><div><b>'+esc(st.name)+'</b><small>Цей урок: '+ls+'/'+cap+' ⭐'+(st.double?' · наступна ×2':'')+'</small></div></div>'+
   '<div class="pop-rules">'+RULES.map(r=>'<button class="rule" data-a="award" data-id="'+sid+'" data-r="'+r.id+'" '+(ls>=cap?'disabled':'')+'><span class="re">'+r.e+'</span><span><b>'+r.n+'</b><small>'+r.ua+'</small></span></button>').join('')+'</div>'+
   '<div class="pop-foot"><button class="btn" data-a="profile" data-id="'+sid+'">🃏 Колекція</button><button class="btn gold" data-a="pack" data-id="'+sid+'" '+((st.stars||0)>=price?'':'disabled')+'>🎁 Пак · '+price+'⭐</button></div>';
  pop.classList.add('on');
  const r=anchor.getBoundingClientRect(),pw=340,ph=pop.offsetHeight;
  let x=r.right+10;if(x+pw>innerWidth-10)x=r.left-pw-10;if(x<10)x=Math.max(10,Math.min(innerWidth-pw-10,r.left+r.width/2-pw/2));
  let y=r.top+r.height/2-ph/2;y=Math.max(10,Math.min(innerHeight-ph-10,y));
  pop.style.left=x+'px';pop.style.top=y+'px';sfx.pop();
}
function closePop(){pop.classList.remove('on');popSid=null;}

/* ---------- modal ---------- */
const M={cur:null};
function openModal(m){closePop();M.cur=m;drawModal(true);}
function drawModal(first){
  const m=M.cur;const ov=$('#overlay');if(!m){ov.innerHTML='';return;}
  const sc=ov.querySelector('.modal');const top=sc?sc.scrollTop:0;
  ov.innerHTML='<div class="wrap '+(m.side?'side':'')+'"><div class="back" data-a="closeModal"></div><div class="modal '+(m.cls||'')+'"><button class="ibtn mx" data-a="closeModal">✕</button>'+m.html()+'</div></div>';
  const nm=ov.querySelector('.modal');
  if(!first){nm.style.animation='none';const bk=ov.querySelector('.back');if(bk)bk.style.animation='none';nm.scrollTop=top;}
  if(m.mount)m.mount(nm);
}
function closeModal(){M.cur=null;$('#overlay').innerHTML='';}
function confirmBox(text,okLabel,onOk,danger){
  openModal({html:()=>'<h2>'+esc(text)+'</h2><div class="row end"><button class="btn" data-a="closeModal">Скасувати</button><button class="btn '+(danger?'danger':'gold')+'" id="okb">'+esc(okLabel)+'</button></div>',
   mount:el=>{el.querySelector('#okb').onclick=()=>{closeModal();onOk();};}});
}

function openForge(sid){
  const picks=[];
  openModal({cls:'mid',html:()=>{
    const st=S.students[sid];
    const list=CARDS.filter(c=>((st.cards||{})[c.id]||0)>1);
    return '<h2>🔮 Snow Forge</h2><p class="note" style="margin-bottom:14px">Оберіть 3 зайві копії. Вони перетворяться на карточку, якої в '+esc(st.name)+' ще немає. Остання копія кожної карточки залишається в альбомі.</p>'+
     '<div class="tcards" style="max-height:none">'+list.map(c=>{const spare=st.cards[c.id]-1;const used=picks.filter(x=>x===c.id).length;
       return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">'+cardHTML(c,{w:104,count:spare-used+1>1?spare-used:0,cls:used?'sel':'',attrs:'data-pick="'+c.id+'"'})+'<span class="note">зайвих: '+(spare-used)+(used?' · обрано '+used:'')+'</span></div>';}).join('')+'</div>'+
     '<div class="row end"><button class="btn" id="fclear">Скинути</button><button class="btn purple big" id="fgo" '+(picks.length===3?'':'disabled')+'>🔮 Forge! ('+picks.length+'/3)</button></div>';
  },mount:el=>{
    el.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{
      const id=c.dataset.pick;const st=S.students[sid];const spare=st.cards[id]-1;const used=picks.filter(x=>x===id).length;
      if(used<spare&&picks.length<3){picks.push(id);sfx.pop();}else{const i=picks.indexOf(id);if(i>=0)picks.splice(i,1);}
      drawModal();
    });
    el.querySelector('#fclear').onclick=()=>{picks.length=0;drawModal();};
    el.querySelector('#fgo').onclick=()=>forge(sid,picks.slice());
  }});
}
